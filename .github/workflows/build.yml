name: Build KriptoDok App (Windows)

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app (.exe)
        run: npm run dist

      - name: Upload KriptoDok (zip)
        uses: actions/upload-artifact@v4
        with:
          name: KriptoDok
          path: dist/KriptoDok-win-x64.zip
          retention-days: 3
